
services:
  web: 
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    links:
      - db:db
    depends_on:
     - db
    networks:
      - djangonetwork 

  db:
    image: postgres:16.4-alpine3.20
    restart: always
    ports:
     - 5433:5432
    networks:
      - djangonetwork
  
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

networks:
  djangonetwork:
    driver: bridge
